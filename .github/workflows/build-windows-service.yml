name: Build Windows Service

on:
  push:
    branches: [ main ]
    tags: [ 'v[0-9]*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Windows Service
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    env:
      # The NSIS release the installer is built with (see "Cache NSIS").
      NSIS_VERSION: "3.13"
      NSIS_SHA256: ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # Pull the LFS-tracked bundled model (video_grouper/models/*.onnx) so
        # PyInstaller bundles the real weights, not a pointer file.
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install dependencies
      run: |
        uv sync --extra dev --extra tray --extra service

    - name: Extract version information
      id: version
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/*') {
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          $BUILD_NUMBER = '0'
        } else {
          $VERSION = '0.0.0'
          $BUILD_NUMBER = git rev-list --count HEAD
        }
        echo "VERSION=$VERSION" >> $env:GITHUB_ENV
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $env:GITHUB_ENV
        echo "version=$VERSION" >> $env:GITHUB_OUTPUT
        echo "build_number=$BUILD_NUMBER" >> $env:GITHUB_OUTPUT

    - name: Update version.py
      shell: pwsh
      run: |
        $content = Get-Content video_grouper/version.py -Raw
        # Match ANY current VERSION = "x.y.z" line, not just "0.0.0".
        # The previous narrow regex silently no-op'd whenever someone
        # bumped version.py manually, so the published binary's version
        # would lag the git tag.
        $content = $content -replace 'VERSION = "[^"]*"', "VERSION = `"${{ env.VERSION }}`""
        $content = $content -replace 'BUILD_NUMBER = "[^"]*"', "BUILD_NUMBER = `"${{ env.BUILD_NUMBER }}`""
        Set-Content video_grouper/version.py $content

    - name: Inject YouTube OAuth credentials
      shell: pwsh
      env:
        SOCCER_CAM_YT_CLIENT_ID: ${{ secrets.SOCCER_CAM_YT_CLIENT_ID }}
        SOCCER_CAM_YT_CLIENT_SECRET: ${{ secrets.SOCCER_CAM_YT_CLIENT_SECRET }}
      run: |
        if ($env:SOCCER_CAM_YT_CLIENT_ID -and $env:SOCCER_CAM_YT_CLIENT_SECRET) {
          @"
        # Auto-generated by GitHub Actions -- do not commit
        YT_CLIENT_ID = "$($env:SOCCER_CAM_YT_CLIENT_ID)"
        YT_CLIENT_SECRET = "$($env:SOCCER_CAM_YT_CLIENT_SECRET)"
        "@ | Set-Content -Path video_grouper/utils/_youtube_secrets.py -Encoding UTF8
          Write-Host "YouTube OAuth credentials injected"
        } else {
          Write-Host "WARNING: YouTube OAuth secrets not configured in GitHub"
        }

    - name: Inject TTT configuration
      shell: pwsh
      env:
        SOCCER_CAM_TTT_SUPABASE_URL: ${{ secrets.SOCCER_CAM_TTT_SUPABASE_URL }}
        SOCCER_CAM_TTT_ANON_KEY: ${{ secrets.SOCCER_CAM_TTT_ANON_KEY }}
        SOCCER_CAM_TTT_API_BASE_URL: ${{ secrets.SOCCER_CAM_TTT_API_BASE_URL }}
      run: |
        if ($env:SOCCER_CAM_TTT_SUPABASE_URL -and $env:SOCCER_CAM_TTT_ANON_KEY -and $env:SOCCER_CAM_TTT_API_BASE_URL) {
          @"
        # Auto-generated by GitHub Actions -- do not commit
        TTT_SUPABASE_URL = "$($env:SOCCER_CAM_TTT_SUPABASE_URL)"
        TTT_ANON_KEY = "$($env:SOCCER_CAM_TTT_ANON_KEY)"
        TTT_API_BASE_URL = "$($env:SOCCER_CAM_TTT_API_BASE_URL)"
        "@ | Set-Content -Path video_grouper/utils/_ttt_config.py -Encoding UTF8
          Write-Host "TTT configuration injected"
        } else {
          Write-Host "INFO: TTT secrets not configured in GitHub - using production defaults"
        }

    # Multi-target spec builds service + tray sharing one _internal/.
    # See video_grouper/installer/VideoGrouper.spec for the analysis,
    # MERGE, and COLLECT setup, plus the rationale for each module exclude.
    - name: Build service + tray executables
      run: |
        uv run pyinstaller --noconfirm `
          --distpath=video_grouper/dist --workpath=video_grouper/build `
          video_grouper/installer/VideoGrouper.spec

    # NSIS is not on the windows-2025 runner image. It used to come from the
    # Chocolatey community feed, which Chocolatey itself says not to rely on
    # for organizational builds; on 2026-11-28 the feed answered 503, choco
    # reported "installed 0/0 packages" and exited 0, and the build failed a
    # step later. So: one pinned release, from the NSIS project's own
    # SourceForge downloads, checked against its SHA-256 (recorded when
    # pinned; the SHA-1 matched the one SourceForge publishes), and cached so
    # an upstream outage only matters to the first run after a version bump.
    # To upgrade: change NSIS_VERSION and NSIS_SHA256 in the job's env.
    - name: Cache NSIS
      id: nsis-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}\nsis
        key: nsis-${{ env.NSIS_VERSION }}-${{ env.NSIS_SHA256 }}

    - name: Download NSIS
      if: steps.nsis-cache.outputs.cache-hit != 'true'
      run: |
        $zip = Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION.zip"
        $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$env:NSIS_VERSION/nsis-$env:NSIS_VERSION.zip"
        # SourceForge serves its download page instead of the file to
        # browser-like user agents; a curl-style agent gets the redirect.
        Invoke-WebRequest -Uri $url -OutFile $zip -UserAgent "curl/8" `
          -MaximumRetryCount 5 -RetryIntervalSec 15
        $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $env:NSIS_SHA256) {
          throw "NSIS $env:NSIS_VERSION download has SHA-256 $actual, expected $env:NSIS_SHA256"
        }
        Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "nsis")

    - name: Check NSIS
      run: |
        $makensis = Join-Path $env:RUNNER_TEMP "nsis\nsis-$env:NSIS_VERSION\makensis.exe"
        if (-not (Test-Path $makensis)) {
          throw "makensis.exe not found at $makensis"
        }
        $reported = (& $makensis -VERSION).Trim()
        if ($reported -ne "v$env:NSIS_VERSION") {
          throw "makensis reports $reported, expected v$env:NSIS_VERSION"
        }
        Add-Content -Path $env:GITHUB_ENV -Value "MAKENSIS=$makensis"

    - name: Build installer
      run: |
        & $env:MAKENSIS /DVERSION=${{ env.VERSION }} /DBUILD_NUMBER=${{ env.BUILD_NUMBER }} video_grouper/installer/installer.nsi
        if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: VideoGrouper-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}
        path: |
          video_grouper/dist/VideoGrouperSetup.exe

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: VideoGrouper-${{ needs.build.outputs.version }}-${{ needs.build.outputs.build_number }}
        path: artifacts

    - name: Create or update GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        body: |
          # VideoGrouper ${{ needs.build.outputs.version }}

          ## Windows Installer
          Download and run `VideoGrouperSetup.exe` to install the Windows application.
        files: |
          artifacts/VideoGrouperSetup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
