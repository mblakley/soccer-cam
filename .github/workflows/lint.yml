name: Lint

# Runs ruff (check + format), mypy, and the unit tests on every PR targeting main, plus
# every push to main itself. This is the gate that catches regressions
# in already-clean modules; deferred per-module ignore_errors entries in
# pyproject.toml are tracked separately.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv handles its own Python install and bundles the project venv;
      # matches how scripts/smoke_real_service.py runs locally.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync project dependencies
        # --frozen to honor uv.lock; --no-install-project skips compiling
        # the package itself (mypy and ruff don't need it built).
        run: uv sync --frozen --no-install-project

      - name: ruff check
        run: uv run --with ruff ruff check .

      - name: ruff format check
        run: uv run --with ruff ruff format --check .

      - name: mypy
        run: uv run mypy video_grouper/

  unit-tests:
    # The unit suite (~2100 tests, ~10 min) was never run in CI -- only locally.
    # Windows runner: the app ships as a Windows service + tray and the suite is
    # verified green there; the repo is public, so hosted minutes are free.
    name: unit tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync project dependencies
        run: uv sync --frozen

      - name: pytest (not integration, not e2e)
        run: uv run pytest -m "not integration and not e2e" -q -p no:cacheprovider
